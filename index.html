  <style>
    /* =================================================================
       GLOBAL THEME & RESET
       ================================================================= */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 15%, #25123d 0%, #120924 60%, #06020d 100%);
      --accent-pink: #ff5e7e;
      --accent-rose: #ff2a6d;
      --accent-gold: #ffd166;
      --accent-purple: #9d4edd;
      --plate-porcelain: linear-gradient(145deg, #ffffff, #e6e9f0);
      --glass-panel: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 15px 45px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: #fefefe;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Elements */
    #star-canvas, #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    #star-canvas { z-index: 1; }
    #confetti-canvas { z-index: 999; }

    /* Floating Music Toggle */
    .music-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid var(--glass-border);
      color: #fff;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 20px rgba(255, 94, 126, 0.35);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .music-btn:hover {
      transform: scale(1.12);
    }

    /* App Layout */
    .main-wrapper {
      position: relative;
      z-index: 10;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 18px 80px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Frosted Glass Panels */
    .glass-card {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 28px;
      padding: 34px 24px;
      width: 100%;
      box-shadow: var(--glass-shadow);
      margin-bottom: 35px;
      text-align: center;
    }

    /* Typography */
    .title-primary {
      font-family: 'Sacramento', cursive;
      font-size: clamp(3rem, 9vw, 5.2rem);
      color: #ff9ebb;
      text-shadow: 0 0 20px rgba(255, 94, 126, 0.7);
      line-height: 1.1;
      margin-bottom: 6px;
    }
    .title-sub {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      color: var(--accent-gold);
      margin-bottom: 12px;
    }
    .intro-text {
      font-size: 0.96rem;
      line-height: 1.7;
      color: #e2e8f0;
      max-width: 620px;
      margin: 0 auto 14px auto;
    }

    /* Buttons */
    .btn-action {
      background: linear-gradient(135deg, #ff2a6d, #8338ec);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 13px 28px;
      border-radius: 35px;
      cursor: pointer;
      box-shadow: 0 6px 22px rgba(255, 42, 109, 0.45);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 8px 6px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255, 42, 109, 0.65);
    }
    .btn-action:active {
      transform: translateY(1px);
    }

    /* =================================================================
       3D CAKE ARENA & ROTATING PERSPECTIVE
       ================================================================= */
    .stage-3d-arena {
      position: relative;
      width: 100%;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      padding: 30px 0;
    }

    /* 3D Scene Container */
    .cake-world-3d {
      position: relative;
      width: 320px;
      height: 250px;
      transform-style: preserve-3d;
